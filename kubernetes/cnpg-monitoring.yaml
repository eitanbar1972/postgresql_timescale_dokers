apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-cluster-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cnpg-cluster-alerts
    app.kubernetes.io/part-of: cloudnativepg
spec:
  groups:
    - name: cnpg-clusters.rules
      rules:
        - alert: CNPGInstanceDown
          expr: cnpg_collector_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: CloudNativePG instance is unavailable
            description: "Instance {{ $labels.pod }} in cluster {{ $labels.cluster }} has been unavailable for more than two minutes."
        - alert: CNPGReplicationLagHigh
          expr: cnpg_pg_replication_lag > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG replication lag is high
            description: "Instance {{ $labels.pod }} in cluster {{ $labels.cluster }} is more than five minutes behind the primary."
        - alert: CNPGMetricsCollectionError
          expr: cnpg_collector_last_collection_error == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG metrics collection is failing
            description: "The metrics collector on {{ $labels.pod }} in cluster {{ $labels.cluster }} has reported errors for five minutes."
