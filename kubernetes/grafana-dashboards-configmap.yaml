apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cloudnativepg
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloudnative-pg-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(cnpg_collector_up{job=~\"monitoring/($cluster)\"} == 0)", "refId": "A"}],
          "title": "Instances Down",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "none"}},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "count(max by (pod) (cnpg_collector_up{job=~\"monitoring/($cluster)\"}))", "refId": "A"}],
          "title": "Observed Instances",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["max"], "fields": "", "values": false}},
          "targets": [{"expr": "max(cnpg_pg_replication_lag{job=~\"monitoring/($cluster)\"})", "refId": "A"}],
          "title": "Max Replication Lag",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "decbytes"}},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["sum"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(cnpg_pg_database_size_bytes{job=~\"monitoring/($cluster)\",datname!=\"template0\",datname!=\"template1\"})", "refId": "A"}],
          "title": "Total Database Size",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 5,
          "targets": [{"expr": "sum by (pod) (cnpg_backends_total{job=~\"monitoring/($cluster)\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Backends by Pod",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 6,
          "targets": [{"expr": "sum by (pod) (cnpg_pg_database_size_bytes{job=~\"monitoring/($cluster)\",datname!=\"template0\",datname!=\"template1\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Database Size by Pod",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "id": 7,
          "targets": [{"expr": "sum by (pod) (rate(cnpg_pg_stat_database_xact_commit{job=~\"monitoring/($cluster)\",datname!=\"template0\",datname!=\"template1\"}[5m]))", "legendFormat": "{{pod}} commits", "refId": "A"},{"expr": "sum by (pod) (rate(cnpg_pg_stat_database_xact_rollback{job=~\"monitoring/($cluster)\",datname!=\"template0\",datname!=\"template1\"}[5m]))", "legendFormat": "{{pod}} rollbacks", "refId": "B"}],
          "title": "Transactions Rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "id": 8,
          "targets": [{"expr": "sum by (pod) (cnpg_backends_waiting_total{job=~\"monitoring/($cluster)\"})", "legendFormat": "{{pod}} waiting", "refId": "A"},{"expr": "max by (pod) (cnpg_pg_replication_in_recovery{job=~\"monitoring/($cluster)\"})", "legendFormat": "{{pod}} in_recovery", "refId": "B"}],
          "title": "Waiting Backends / Recovery",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 20},
          "id": 9,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(cnpg_custom_blocking_overview_blocked_sessions{job=~\"monitoring/($cluster)\"})", "refId": "A"}],
          "title": "Blocked Sessions",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 20},
          "id": 10,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(cnpg_custom_blocking_overview_idle_in_transaction_sessions{job=~\"monitoring/($cluster)\"})", "refId": "A"}],
          "title": "Idle In Transaction",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 20},
          "id": 11,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["max"], "fields": "", "values": false}},
          "targets": [{"expr": "max(cnpg_custom_blocking_overview_max_blocked_query_age_seconds{job=~\"monitoring/($cluster)\"})", "refId": "A"}],
          "title": "Oldest Blocked Query",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 20},
          "id": 12,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(increase(cnpg_pg_stat_database_deadlocks{job=~\"monitoring/($cluster)\",datname=~\".+\",datname!=\"template0\",datname!=\"template1\"}[6h]))", "refId": "A"}],
          "title": "Deadlocks (6h)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "id": 13,
          "targets": [{"expr": "sum by (pod, state) (cnpg_custom_sessions_by_state_sessions{job=~\"monitoring/($cluster)\"})", "legendFormat": "{{pod}} {{state}}", "refId": "A"}],
          "title": "Sessions By State",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "id": 14,
          "targets": [{"expr": "sum by (pod, wait_event_type) (cnpg_custom_wait_events_sessions{job=~\"monitoring/($cluster)\"})", "legendFormat": "{{pod}} {{wait_event_type}}", "refId": "A"}],
          "title": "Sessions Waiting By Event Type",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "id": 15,
          "targets": [{"expr": "max by (pod, datname) (cnpg_custom_long_running_activity_longest_transaction_seconds{job=~\"monitoring/($cluster)\"})", "legendFormat": "{{pod}} {{datname}} txn", "refId": "A"},{"expr": "max by (pod, datname) (cnpg_custom_long_running_activity_longest_active_query_seconds{job=~\"monitoring/($cluster)\"})", "legendFormat": "{{pod}} {{datname}} query", "refId": "B"}],
          "title": "Longest Transactions / Queries",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "id": 16,
          "targets": [{"expr": "sum by (pod, datname) (increase(cnpg_pg_stat_database_deadlocks{job=~\"monitoring/($cluster)\",datname=~\".+\",datname!=\"template0\",datname!=\"template1\"}[5m]))", "legendFormat": "{{pod}} {{datname}} deadlocks", "refId": "A"},{"expr": "sum by (pod, datname) (increase(cnpg_pg_stat_database_conflicts{job=~\"monitoring/($cluster)\",datname=~\".+\",datname!=\"template0\",datname!=\"template1\"}[5m]))", "legendFormat": "{{pod}} {{datname}} conflicts", "refId": "B"}],
          "title": "Deadlocks / Conflicts Rate",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["cloudnativepg", "postgresql", "timescaledb"],
      "templating": {
        "list": [
          {
            "current": {"selected": true, "text": ".*", "value": ".*"},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "definition": "label_values(cnpg_collector_up{namespace=\"default\"}, cluster)",
            "hide": 0,
            "includeAll": true,
            "label": "Cluster",
            "multi": true,
            "name": "cluster",
            "options": [],
            "query": "label_values(cnpg_collector_up{namespace=\"default\"}, cluster)",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "CloudNativePG Multi-Cluster Overview",
      "version": 1
    }
