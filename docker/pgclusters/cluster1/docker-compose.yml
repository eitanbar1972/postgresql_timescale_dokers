version: '3.8'

services:
  pg1-primary:
    image: bitnami/postgresql:17
    container_name: pg1-primary
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=ChangeMe1
      - POSTGRESQL_DATABASE=postgres
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass1
    ports:
      - "55432:5432"
    volumes:
      - pgcluster1_primary_data:/bitnami/postgresql

  pg1-replica:
    image: bitnami/postgresql:17
    container_name: pg1-replica
    depends_on:
      - pg1-primary
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=ChangeMe1
      - POSTGRESQL_DATABASE=postgres
      - POSTGRESQL_REPLICATION_MODE=replica
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass1
      - POSTGRESQL_MASTER_HOST=pg1-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
    volumes:
      - pgcluster1_replica_data:/bitnami/postgresql

volumes:
  pgcluster1_primary_data: {}
  pgcluster1_replica_data: {}
