services:
  pg2-primary:
    image: postgres:17
    container_name: pg2-primary
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ChangeMe2
      - POSTGRES_DB=postgres
      - REPLICATION_USER=repl_user
      - REPLICATION_PASSWORD=repl_pass2
    ports:
      - "55433:5432"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    volumes:
      - pgcluster2_primary_data:/var/lib/postgresql/data
      - ./primary-init:/docker-entrypoint-initdb.d

  pg2-replica:
    image: postgres:17
    container_name: pg2-replica
    depends_on:
      - pg2-primary
    environment:
      - PGDATA=/var/lib/postgresql/data
      - REPLICATION_USER=repl_user
      - REPLICATION_PASSWORD=repl_pass2
      - PRIMARY_HOST=pg2-primary
    volumes:
      - pgcluster2_replica_data:/var/lib/postgresql/data
      - ./replica-init/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh
    entrypoint:
      - bash
      - /usr/local/bin/replica-entrypoint.sh

volumes:
  pgcluster2_primary_data: {}
  pgcluster2_replica_data: {}
